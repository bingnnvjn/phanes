title = "Fable public-release secret scan"

[extend]
useDefault = true

[[allowlists]]
description = "Files outside the public release input"
paths = [
  '''(^|/)\.git(/|$)''',
  '''(^|/)\.scratch(/|$)''',
  '''(^|/)\.crew(/|$)''',
  '''(^|/)target(/|$)''',
  '''(^|/)build(/|$)''',
  '''(^|/)\.gradle(/|$)''',
  '''(^|/)\.cxx(/|$)''',
  '''(^|/)\.externalNativeBuild(/|$)''',
  '''(^|/).*\.log$''',
  '''(^|/)coverage_report\.txt$''',
  '''(^|/)out\.png$''',
]

# This is a path boundary, not a finding suppression. The gate's forbidden-path
# check still rejects a tracked credential/build artifact anywhere in the tree.
# Any new excluded path requires a corresponding ADR-0012 review.

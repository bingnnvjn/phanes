# Human-review ledger consumed by scripts/rust-supply-chain-gate.sh.
#
# Any new path/git source requires a new record with all fields below. The
# script compares direct Cargo manifest sources to this ledger, rejects stale
# review dates, and hashes path source trees. Cargo-deny separately rejects
# unapproved registry and git transitive sources.

version = 1

[[source-exceptions]]
type = "path"
manifest = "spike-session/Cargo.toml"
crate = "portable-pty"
version = "0.9.0"
source = "vendor/portable-pty"
resolved-path = "spike-session/vendor/portable-pty"
upstream = "https://github.com/wezterm/wezterm"
upstream-revision = "f8921727a11b9f8b073e8c24821d72fd41283500"
license = "MIT"
owner = "Fable Rust maintainers"
reviewed-on = "2026-08-15"
review-by = "2026-11-15"
reason = "Preserve the Java session layer's login-shell argv[0] semantics (-bash); portable-pty 0.9.0 has no upstream argv0 API."
content-sha256 = "8a041cad33dcaf557b65f4d77af1f6d2f92487f506fe5aff03220682d1c36c1e"

[[advisory-exceptions]]
id = "RUSTSEC-2026-0192"
crate = "ttf-parser"
version = "0.25.1"
kind = "unmaintained"
manifest = "spike-render/Cargo.toml"
owner = "Fable Rust maintainers"
reviewed-on = "2026-08-15"
review-by = "2026-09-15"
reason = "Reached through fontdue 0.9.4 and rustybuzz 0.20.1; the RustSec advisory reports no safe upgrade. Retain only until the renderer can migrate its font parsing/shaping stack."

[[advisory-exceptions]]
id = "RUSTSEC-2026-0206"
crate = "rustybuzz"
version = "0.20.1"
kind = "unmaintained"
manifest = "spike-render/Cargo.toml"
owner = "Fable Rust maintainers"
reviewed-on = "2026-08-15"
review-by = "2026-09-15"
reason = "Fable's selected shaping implementation; the RustSec advisory reports no safe upgrade. Re-evaluate a migration to harfrust or another maintained shaping path before expiry."


apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    namespace = "com.gph.fable.shared"
    compileSdk = 36
    // 工单 34：AGP 9 内置 Kotlin（不引 KGP），termux-shared 迁移 Kotlin。
    enableKotlin = true
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: "22.1.7171670"

    dependencies {
        implementation "androidx.appcompat:appcompat:1.7.1"
        implementation "androidx.annotation:annotation:1.10.0"
        implementation "androidx.core:core:1.18.0"
        implementation "com.google.android.material:material:1.14.0"
        implementation "com.google.guava:guava:33.6.0-jre"
        implementation "com.google.code.findbugs:jsr305:3.0.2"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"
        implementation "org.lsposed.hiddenapibypass:hiddenapibypass:6.1"

        // preference:1.2.1 -> slidingpanelayout:1.2.0 pulls window:1.0.0; ViewUtils has been
        // migrated to androidx.window.layout.WindowMetricsCalculator (window 1.0.0 API).
        implementation "androidx.window:window:1.0.0"

        // Do not increment version higher than 2.5 or there
        // will be runtime exceptions on android < 8
        // due to missing classes like java.nio.file.Path.
        implementation "commons-io:commons-io:2.5"

        implementation project(":terminal-view")

        implementation "com.termux:termux-am-library:v2.0.0"
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 28
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            ndkBuild {
                cppFlags ''
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    publishing {
        singleVariant("release")
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        ndkBuild {
            path file('src/main/cpp/Android.mk')
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.3"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.4.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}

task sourceJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    archiveClassifier = "sources"
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.release
                groupId = 'com.gph.fable'
                artifactId = 'termux-shared'
                version = '0.118.0'
                artifact(sourceJar)
            }
        }
    }
}

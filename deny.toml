# Fable Rust dependency policy (工单 52).
#
# This file is intentionally shared by the three independent crates. Run it
# only through scripts/rust-supply-chain-gate.sh so every manifest is checked
# with --locked and the local-source ledger.

[graph]
all-features = true

[advisories]
# RustSec is a dependency risk signal only. It does not certify JNI, FFI, PTY,
# renderer, or other Fable memory-safety properties.
db-urls = ["https://github.com/RustSec/advisory-db"]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 is pulled by fontdue/rustybuzz; advisory reports no safe upgrade. Tracked in supply-chain-exceptions.toml and must be reviewed before 2026-09-15." },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz 0.20.1 is the selected shaping implementation; advisory reports no safe upgrade. Tracked in supply-chain-exceptions.toml and must be reviewed before 2026-09-15." },
]
# One config is run against three separate manifests. Each ignored advisory is
# re-promoted to an error for its affected manifest by the gate script.
unused-ignored-advisory = "allow"

[licenses]
confidence-threshold = 0.93
include-dev = true
include-build = true
unused-allowed-license = "allow"
unused-license-exception = "deny"
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
exceptions = []

[licenses.private]
# Internal Fable cdylib crates explicitly set `publish = false`; their
# distribution license is outside the third-party dependency allow-list.
ignore = true

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
skip = [
    { crate = "bitflags@1.3.2", reason = "portable-pty 0.9.0 requires bitflags 1 on its Windows support path while nix 0.28 requires bitflags 2." },
    { crate = "foldhash@0.1.5", reason = "fontdue 0.9.4 pins hashbrown 0.15; wgpu 30 uses newer hashbrown/foldhash. Revisit when either direct dependency is updated." },
    { crate = "foldhash@0.2.0", reason = "wgpu 30 resolves multiple hashbrown generations; retain only while its graph requires this intermediate foldhash version." },
    { crate = "hashbrown@0.15.5", reason = "fontdue 0.9.4 pins this generation; it cannot be unified with the wgpu 30 graph without a dependency upgrade." },
    { crate = "hashbrown@0.16.1", reason = "wgpu 30's gpu-allocator path requires this intermediate generation alongside hashbrown 0.17." },
    { crate = "syn@2.0.119", reason = "jni-macros 0.22.4 and zerocopy-derive require syn 2 while jni-sys-macros requires syn 3." },
    { crate = "thiserror@1.0.69", reason = "portable-pty's filedescriptor dependency requires thiserror 1 while jni 0.22 uses thiserror 2." },
    { crate = "thiserror-impl@1.0.69", reason = "The thiserror 1 compatibility exception also requires its matching derive macro alongside jni's thiserror-impl 2." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
unused-allowed-source = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
